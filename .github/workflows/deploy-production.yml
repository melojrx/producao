name: Rollback VPS (manual legado)

on:
  workflow_dispatch:
    inputs:
      confirm_vps_rollback:
        description: 'Digite VPS-ROLLBACK-APROVADO somente após autorizar o retorno à VPS'
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy VPS
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://producao.costurai.com.br
    steps:
      - name: Exigir autorização específica de rollback
        env:
          CONFIRM_VPS_ROLLBACK: ${{ inputs.confirm_vps_rollback }}
        run: test "$CONFIRM_VPS_ROLLBACK" = 'VPS-ROLLBACK-APROVADO'
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/producao}"
            export DEPLOY_REF=main
            cd "${DEPLOY_PATH}"
            git fetch origin "${DEPLOY_REF}"
            git checkout "${DEPLOY_REF}"
            git reset --hard "origin/${DEPLOY_REF}"
            bash scripts/deploy/vps-production.sh
